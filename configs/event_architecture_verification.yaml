# Bounded architecture smoke test, not a policy-strength experiment.
# Loading this file does not start training. A deliberate run performs only
# two iterations: battle parameters first, squad parameters second.
# Keep outputs separate from every older trained/verification checkpoint.
stage: main_00-01
stage_pool: [main_00-01]
squad: []
auto_squad: true
squad_size: 6
joint_training_mode: alternating
curriculum: false
operator_progression: {}
skill_overrides: {}
device: cpu
num_threads: 1
seed: 12345
iterations: 2
episodes_per_iteration: 1
future_events_enabled: true
planner_enabled: true
mcts_simulations: 4
max_depth: 32
top_k_actions: 4
progressive_widening: true
widening_coefficient: 2.0
widening_exponent: 0.5
max_decisions: 1024
horizon: 300
c_puct: 1.5
dirichlet_alpha: 0.3
dirichlet_epsilon: 0.25
prior_uniform_mix: 0.3
temperature: 1.0
temperature_schedule: [{iteration: 0, value: 1.0}]
uniform_mix_schedule: [{iteration: 0, value: 0.3}]
skip_forced_actions: true
decision_log_top_k: 8
batch_size: 4
replay_buffer_size: 2048
training_steps_per_iteration: 2
learning_rate: 0.0003
weight_decay: 0.0001
value_loss_weight: 1.0
gradient_clip: 5.0
evaluation_episodes: 1
evaluation_seed: 80000
checkpoint_interval: 1
promote_on_equal: false
data_dir: null
output_dir: outputs/event_architecture/smoke
checkpoint_dir: outputs/event_architecture/smoke/checkpoints
warm_start: null
resume_from: null
