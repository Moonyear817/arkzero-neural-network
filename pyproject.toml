[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "arknights-zero-sim"
version = "0.2.0"
description = "Independent, deterministic Arknights research simulator; limited verified scope"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
test = ["pytest>=8,<10"]
alphazero = ["torch>=2.6,<3", "numpy>=1.26,<3", "PyYAML>=6,<7", "matplotlib>=3.8,<4"]
desktop = ["PySide6>=6.8,<6.12", "psutil>=6,<8", "PyYAML>=6,<7"]
desktop-test = ["pytest-qt>=4.4,<5"]
ipa-research = ["UnityPy==1.25.3", "lz4>=4,<5"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["arknights_sim*", "agents*", "network*", "mcts*", "training*", "desktop*"]
